# meta-pktrec: FPGA Packet Recorder layer (Ethernet FMC Max port tools, kernel
# config for the UIO register access). Enabled per board by listing
# Yocto/meta-pktrec in Yocto/bsp/<board>/bblayers-extra.txt (after meta-fdrec).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pktrec"
BBFILE_PATTERN_meta-pktrec = "^${LAYERDIR}/"
# Below meta-user (7) so a board's meta-user can override anything here.
BBFILE_PRIORITY_meta-pktrec = "6"
LAYERSERIES_COMPAT_meta-pktrec = "scarthgap"
LAYERDEPENDS_meta-pktrec = "core"

# Repo root (Yocto/meta-pktrec/../..): recipes take their sources from sw/.
PKTREC_REPO_ROOT := "${@os.path.normpath(os.path.join('${LAYERDIR}', '..', '..'))}"
