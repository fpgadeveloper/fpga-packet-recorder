# FPGA Packet Recorder kernel configuration fragment

# generic-uio for the eth_ports register blocks (pktrec-phy). Built in so that the
# boot.scr argument uio_pdrv_genirq.of_id=generic-uio binds them at boot (as a
# module it would never be auto-loaded: the compatible is set at run time).
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
