# chronyd configuration of the FPGA Packet Recorder image (meta-pktrec).
#
# CLOCK_REALTIME is the reference of the capture timebase (pktrec-tb), so the
# clock's frequency matters as much as its offset: chronyd trains the kernel
# frequency within minutes and stores it in the drift file, so later boots
# start with the right frequency. Check with 'chronyc tracking' / 'chronyc
# sources' ('pktrec-tb status' shows the kernel frequency correction too).
#
# Public pool, polled every 64..256 s (maxpoll 8): a faster frequency estimate
# than the default 1024 s maximum, still polite to the pool. Replace with your
# own server(s) for better absolute time, e.g. a LAN server:
#   server 192.168.1.1 iburst minpoll 4 maxpoll 6
pool pool.ntp.org iburst maxpoll 8

# Extra configuration and sources (NetworkManager / DHCP hooks, local files)
confdir /etc/chrony/conf.d
sourcedir /etc/chrony/sources.d

# Step the clock when it is off by more than 1 s, during the first 3 updates
# only (the board has no battery-backed RTC time at boot); pktrec-tb re-sets the
# timebase after such a step, but never while a capture runs.
makestep 1.0 3

# Frequency of the system clock, kept across reboots.
driftfile /var/lib/chrony/drift

# Kernel 11-minute mode (also clears STA_UNSYNC: pktrec-tb and pktrec-cap read
# "NTP synced" from adjtimex).
rtcsync

logdir /var/log/chrony
